name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    outputs:
      stable_release: ${{ steps.version.outputs.stable_release }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Expected a v-prefixed release tag, got {tag!r}")
          tag_version = tag[1:]
          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          build_source = Path("nativerelay/build.py").read_text()
          match = re.search(r'^VERSION\s*=\s*["\']([^"\']+)["\']\s*$', build_source, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find VERSION in nativerelay/build.py")
          if tag_version != project_version or tag_version != match.group(1):
              raise SystemExit(
                  f"Release tag {tag_version} must match pyproject.toml ({project_version}) "
                  f"and nativerelay/build.py ({match.group(1)})"
              )
          stable_release = re.fullmatch(r"\d+\.\d+\.\d+", tag_version) is not None
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stable_release={str(stable_release).lower()}\n")
          print(f"Release version verified: {tag_version}")
          print(f"Stable PyPI release: {stable_release}")
          PY

      - name: Run unit and parser tests
        run: python -m unittest discover -s tests -v

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel
        run: python -m build --wheel

      - name: Check wheel metadata
        run: python -m twine check dist/*.whl

      - name: Save wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish wheel to PyPI
    needs: build
    if: needs.build.outputs.stable_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nativerelay
    permissions:
      id-token: write
    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1